
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Hiking Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    h2 {
      padding: 0 15px;
    }

    #map {
      height: 85vh;
      width: 100%;
    }
  </style>
</head>

<body>

  <h2>My Hiking Map</h2>
  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create the map, centred on Limerick
    const map = L.map('map').setView([52.66, -8.63], 12);

    // Add the background map
L.tileLayer(
  'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 17,
    attribution:
      'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, SRTM | Map style: &copy; <a href="https://opentopomap.org/">OpenTopoMap</a>'
  }
).addTo(map);

    // Add your first point
    const point = L.marker([52.66, -8.63]).addTo(map);

    point.bindPopup(
      '<b>My first point</b><br>Welcome to my hiking map!'
    );

    // Add a second point
    L.marker([52.68, -8.60])
      .addTo(map)
      .bindPopup('<b>Hiking stop 2</b>');

  </script>

</body>
</html>
